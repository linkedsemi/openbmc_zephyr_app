######################################################
# COMMON CONFIGURATION
######################################################
CONFIG_NEWLIB_LIBC=y
CONFIG_FILE_SYSTEM=y
CONFIG_POSIX_API=y
CONFIG_EVENTFD=y
CONFIG_LOG=n
CONFIG_STATIC_INIT_GNU=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NETWORKING=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POLL_MAX=64
CONFIG_MAX_PTHREAD_MUTEX_COUNT=4096


CONFIG_NET_ZPERF=y
# CONFIG_NET_LOG is not set
CONFIG_NET_UDP=y
# NET_IPV6=n 时该选项无依赖，置 n 避免 Kconfig 警告
CONFIG_NET_TCP_IPV6_ND_REACHABILITY_HINT=n
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_IPV4=y
CONFIG_NET_STATISTICS_UDP=y
CONFIG_NET_STATISTICS_TCP=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=-1
CONFIG_INIT_STACKS=y
CONFIG_NET_L2_ETHERNET=y

# Shell enabled with serial backend
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Enlarge UART RX ring buffer (default 64) so a full pasted command line is
# buffered even if the shell thread is briefly starved; prevents random
# character drops ("Too few arguments" / corrupted args) on long commands.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_NET_SHELL=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_SHELL_STACK_SIZE=8192

######################################################
# 网络配置（参考 zephyr_openbmc - 仅 IPv4）
######################################################
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n


CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONFIG_INIT_TIMEOUT=120

CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.13"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW=""


CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2

# ARP 协议
CONFIG_NET_ARP=y
CONFIG_NET_ARP_GRATUITOUS=y
CONFIG_NET_ARP_GRATUITOUS_TRANSMISSION=y
CONFIG_NET_MGMT_EVENT_INFO=y

CONFIG_NET_IPV4_ACD=y



# CONFIG_NET_CORE_LOG_LEVEL_DBG=y
# CONFIG_NET_ARP_LOG_LEVEL_DBG=y
# CONFIG_NET_L2_ETHERNET_LOG_LEVEL_DBG=y
# CONFIG_NET_ICMPV4_LOG_LEVEL_DBG=y
# CONFIG_NET_IF_LOG_LEVEL_DBG=y
# CONFIG_NET_CONFIG_LOG_LEVEL_DBG=y


CONFIG_NET_TCP_WORKER_PRIO=10

# 网络管理
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET_MGMT=y


CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_RX_REFILL_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32

# 网络栈大小配置
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=3072

CONFIG_NET_LOOPBACK=y


CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=1

CONFIG_NET_CONTEXT_RECV_PKTINFO=y

CONFIG_THREAD_NAME=y

CONFIG_TEST_AUTH=y
