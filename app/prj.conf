######################################################
# COMMON CONFIGURATION
######################################################
CONFIG_NEWLIB_LIBC=y
CONFIG_FILE_SYSTEM=y
CONFIG_POSIX_API=y
CONFIG_EVENTFD=y
CONFIG_LOG=n
# CONFIG_LOG_MODE_MINIMAL=y
# CONFIG_STACK_CANARIES=y
CONFIG_STATIC_INIT_GNU=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NETWORKING=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POLL_MAX=64
CONFIG_MAX_PTHREAD_MUTEX_COUNT=4096


CONFIG_NET_ZPERF=y
# CONFIG_NET_LOG is not set
CONFIG_NET_UDP=y
# NET_IPV6=n 时该选项无依赖，置 n 避免 Kconfig 警告
CONFIG_NET_TCP_IPV6_ND_REACHABILITY_HINT=n
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_IPV4=y
CONFIG_NET_STATISTICS_UDP=y
CONFIG_NET_STATISTICS_TCP=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=-1
CONFIG_INIT_STACKS=y
CONFIG_NET_L2_ETHERNET=y

# Shell enabled with serial backend
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Enlarge UART RX ring buffer (default 64) so a full pasted command line is
# buffered even if the shell thread is briefly starved; prevents random
# character drops ("Too few arguments" / corrupted args) on long commands.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
# Enlarge the per-command parse buffer (default 256) so long busctl calls
# (service + path + signature + args) are not truncated.
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_NET_SHELL=y
# CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_SIZE_OPTIMIZATIONS=y
# CONFIG_LTO=y
CONFIG_SHELL_STACK_SIZE=16384

######################################################
