######################################################


############################################
# UNIX SOCKET DBUS BROKER CONFIGURATION
#Test Target	SOCKETPOOL_SIZE	BUFFER_SIZE	HEAP_SIZE	Max Connections
# 10  clients	    16	            8192	  256KB	          ~10
# 20  clients	    32	            16384	  512KB	          ~20
# 50  clients	    64	            16384	   1MB	        ~40-50
# 100 clients	    128	            32768	   2MB	        ~80-100
############################################
CONFIG_PSRAM=y
CONFIG_NEWLIB_LIBC_MALLOC_SECTION_NAME="PSRAM"
CONFIG_NEWLIB_LIBC_MALLOC_LSQSH=y

CONFIG_SYS_HEAP_RUNTIME_STATS=y

CONFIG_NEWLIB_LIBC_MALLOC_ARENA_SIZE=5242880

CONFIG_MAIN_STACK_SIZE=102400
CONFIG_HEAP_MEM_POOL_SIZE=212992
CONFIG_POSIX_MAX_FDS=112
CONFIG_ZVFS_POLL_MAX=112
CONFIG_ZVFS_OPEN_MAX=80
CONFIG_NET_SOCKETPAIR=y
CONFIG_NET_SOCKETPAIR_BUFFER_SIZE=4096
######################################################
# DBUS SOCKET MODE SELECTION
######################################################
# Enable D-Bus broker subsystem
CONFIG_DBROKER=y
CONFIG_DBUS_BROKER_STACK_SIZE=6144
CONFIG_DBUS_BROKER_PRIORITY=7
# UNIX domain sockets
CONFIG_DBUS_BROKER_SOCKETPOOL=y
CONFIG_DBUS_BROKER_SOCKETPOOL_SIZE=16
CONFIG_DBUS_BROKER_SOCKETPOOL_BUFFER_SIZE=6144
# INET sockets
# CONFIG_DBUS_BROKER_INET=y
# CONFIG_DBUS_BROKER_PORT=55555

CONFIG_ASSERT=y

CONFIG_XIP=y
CONFIG_BOOT_CPU2=n
# CONFIG_THREAD_LOCAL_STORAGE=y
# CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_FRAME_POINTER=y
CONFIG_THREAD_LOCAL_STORAGE=y
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_POSIX_THREADS=y

CONFIG_ZVFS_OPEN_MAX=512
CONFIG_ZVFS_EVENTFD_MAX=512

CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_GNU_EXTENSIONS=y

# Enable fatfs reentry
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_MMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_STORAGE_MEDIA_EMMC=y
CONFIG_FS_FATFS_LFN=y
# end fatfs

CONFIG_POSIX_THREAD_THREADS_MAX=40
CONFIG_POSIX_TIMERS=y
CONFIG_XOPEN_STREAMS=y
CONFIG_CPP_RTTI=y

CONFIG_BASU=y
CONFIG_DBUS_BROKER=y
# CONFIG_NET_DEBUG=y
CONFIG_ZEPHYR_OSAL=y

CONFIG_NET_HOSTNAME="openbmc"
CONFIG_NET_HOSTNAME_DYNAMIC=y

CONFIG_OPENBMC_SDBUSPLUS=y

CONFIG_OPENBMC_PHOSPHOR_HOST_IPMID=y
CONFIG_OPENBMC_PHOSPHOR_NET_IPMID=y

CONFIG_OPENBMC_BOOST=y

CONFIG_OPENBMC_PHOSPHOR_LOGGING=y

CONFIG_OPENBMC_PHOSPHOR_OBJMGR=y

CONFIG_TINYXML2=y

CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_SETTINGS_FILE="wolfssl_user_settings.h"

CONFIG_OPENBMC_PHOSPHOR_DBUS_INTERFACES=y

CONFIG_OPENBMC_SDEVENTPLUS=y



# debug config
# CONFIG_HW_STACK_PROTECTION=y
# CONFIG_PMP_STACK_GUARD_MIN_SIZE=2048
