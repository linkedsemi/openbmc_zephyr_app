############################################
# UNIX SOCKET DBUS BROKER CONFIGURATION
#Test Target	SOCKETPOOL_SIZE	BUFFER_SIZE	HEAP_SIZE	Max Connections
# 10  clients	    16	            8192	  256KB	          ~10
# 20  clients	    32	            16384	  512KB	          ~20
# 50  clients	    64	            16384	   1MB	        ~40-50
# 100 clients	    128	            32768	   2MB	        ~80-100
############################################
CONFIG_PSRAM=y
CONFIG_NEWLIB_LIBC_MALLOC_SECTION_NAME="PSRAM"
CONFIG_NEWLIB_LIBC_MALLOC_LSQSH=y

CONFIG_SYS_HEAP_RUNTIME_STATS=y

CONFIG_NEWLIB_LIBC_MALLOC_ARENA_SIZE=5242880

CONFIG_MAIN_STACK_SIZE=102400
CONFIG_HEAP_MEM_POOL_SIZE=307200
CONFIG_POSIX_MAX_FDS=112
CONFIG_ZVFS_POLL_MAX=112
# CONFIG_ZVFS_OPEN_MAX=112
CONFIG_NET_SOCKETPAIR=y
CONFIG_NET_SOCKETPAIR_BUFFER_SIZE=1024
CONFIG_NET_SOCKETS_AF_UNIX=y
CONFIG_NET_UNIX_BUFFER_SIZE=2048
CONFIG_NET_UNIX_MAX_SOCKETS=64
######################################################
# DBUS SOCKET MODE SELECTION
######################################################
# Enable D-Bus broker subsystem
CONFIG_DBROKER=y

CONFIG_ASSERT=y

CONFIG_XIP=y
CONFIG_BOOT_CPU2=n
# CONFIG_THREAD_LOCAL_STORAGE=y
# CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_FRAME_POINTER=y
CONFIG_THREAD_LOCAL_STORAGE=y
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_POSIX_THREADS=y

CONFIG_ZVFS_OPEN_MAX=512
CONFIG_ZVFS_EVENTFD_MAX=512

CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_GNU_EXTENSIONS=y

#
# File Systems
#
CONFIG_FILE_SYSTEM=y
# CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FILE_SYSTEM_MAX_TYPES=16
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=255
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_BLK_DEV=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_MMC=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# CONFIG_STORAGE_MEDIA_FLASH_RW=y
# CONFIG_STORAGE_MEDIA_EMMC=y
# end of File Systems

# Enable fatfs reentry
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_NUM_FILES=16
CONFIG_FS_FATFS_NUM_DIRS=16
CONFIG_FS_FATFS_TINY=n
CONFIG_FS_FATFS_REENTRANT=y
# end fatfs

# LittleFS Settings
#
CONFIG_FS_LITTLEFS_NUM_FILES=16
CONFIG_FS_LITTLEFS_NUM_DIRS=16
# CONFIG_FS_LITTLEFS_READ_SIZE=512
# CONFIG_FS_LITTLEFS_PROG_SIZE=512
# CONFIG_FS_LITTLEFS_CACHE_SIZE=512
# CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=2048
# CONFIG_FS_LITTLEFS_BLOCK_CYCLES=512
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=20480
# end of LittleFS Settings

CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=1
CONFIG_DYNAMIC_THREAD_STACK_SIZE=10240

CONFIG_SMBUS_SHELL=y
CONFIG_EEPROM=y
CONFIG_EEPROM_EMULATOR=n
CONFIG_EEPROM_SIMULATOR=n
CONFIG_EEPROM_SHELL=y
CONFIG_EEPROM_AT24=y

CONFIG_POSIX_THREAD_THREADS_MAX=40
CONFIG_POSIX_TIMERS=y
CONFIG_XOPEN_STREAMS=y
CONFIG_CPP_RTTI=y

