# Enable fatfs reentry
# FatFs volume IDs use the unix style (FF_STR_VOLUME_ID=2), so mount points
# are "/ro" and "/mnt". This is global: every FatFs mount point and path must
# use "/<volume>/..." (no colon).
CONFIG_ZEPHYR_FATFS_UNIX_MNTPOINT=y
# Rename slot 2 of the volume table ("NAND") to "ro"; it must match the
# disk-name of rofs_disk in the board overlay.
CONFIG_ZEPHYR_FATFS_NAND_ALIAS_UNIX="ro"
# The writable data volume (eMMC) is mounted at CONFIG_FS_ROOT_MNT ("/mnt"),
# so its volume string must be "mnt" as well.
CONFIG_ZEPHYR_FATFS_SD2_ALIAS_UNIX="mnt"
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
# allow reentrance
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_NUM_FILES=16
CONFIG_FS_FATFS_NUM_DIRS=16
CONFIG_FS_FATFS_TINY=n
CONFIG_FS_FATFS_REENTRANT=y
# end fatfs

# LittleFS Settings
#
CONFIG_FS_LITTLEFS_NUM_FILES=16
CONFIG_FS_LITTLEFS_NUM_DIRS=16
# CONFIG_FS_LITTLEFS_READ_SIZE=512
# CONFIG_FS_LITTLEFS_PROG_SIZE=512
# CONFIG_FS_LITTLEFS_CACHE_SIZE=512
# CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=2048
# CONFIG_FS_LITTLEFS_BLOCK_CYCLES=512
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=20480
