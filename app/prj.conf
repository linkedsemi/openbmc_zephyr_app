# debug config
CONFIG_HW_STACK_PROTECTION=y
CONFIG_PMP_STACK_GUARD_MIN_SIZE=256

# CONFIG_DEBUG_THREAD_INFO=y
# CONFIG_THREAD_MONITOR=y
# CONFIG_ISR_STACK_SIZE=10240

CONFIG_SHELL_BACKEND_WOLFSSH=y
CONFIG_SHELL_WOLFSSH_LOGIN_TIMEOUT=5
# ssh_daemon_thread runs wolfSSH handshake (ECDH/AES crypto peaks) AND the
# whole Zephyr shell command execution afterwards; the 4096 default
# overflows (caught by STACK_SENTINEL: K_ERR_STACK_CHK_FAIL). Must be 32768
CONFIG_SHELL_WOLFSSH_DAEMON_STACK_SIZE=32768

# LOG_MODE_MINIMAL renders LOG_* output on the interrupted thread's stack;
# the tiny default idle stack overflows as soon as any driver logs from ISR
# context. Enlarged to accommodate that.
CONFIG_IDLE_STACK_SIZE=2048
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=16384

# enlarge SD write buffer to 16 KiB to speed up SD file writes
CONFIG_SD_BUFFER_SIZE_OVERLAY=16384
# automatically reboot after uploading image
CONFIG_CODEMGT_AUTO_ACTIVATE=y

# User intent: hardware-accelerated AES. No OTBN AES option exists in the
# Kconfig tree (soc/linkedsemi/lsgsh/otbn/Kconfig.wolfssl); the linkedsemi
# hardware AES path is CONFIG_WOLFSSL_LINKEDSEMI_HARDWARE_AES_ALT (LSCRYPT
# peripheral, independent of OTBN).
#
# NOTE: the LSCRYPT alt path does NOT compile in this wolfssl revision --
# wolfcrypt/src/aes.c:12127 (inside the CONFIG_WOLFSSL_LINKEDSEMI_HARDWARE_AES_ALT
# branch) calls aes_config(..., byte_swap, ecb, keysize) with byte_swap/ecb
# never declared, i.e. an upstream bug in that branch. Leave it off until the
# alt implementation is fixed; the software AES + the GCM_TABLE_4BIT setting in
# wolfssl_user_settings.h is what the TLS throughput actually depends on.
#
# The OTBN alts are off for the same "not usable yet" reason: they register
# their own OTBN IRQ handler (wolfcrypt/src/port/linkedsemi/ecc.c
# wc_LS_OTBN_IRQHandler) while the SoC OTBN driver
# (soc/linkedsemi/lsqsh/otbn/otbn_common.c LS_OTBN_IRQHandler) is also built in,
# so the build dies in gen_isr_tables.py:
#   "multiple registrations at table_index 54 for irq 54 (0x36)"
# They become usable only once that driver and the wolfssl alt are made
# mutually exclusive by Kconfig. Nothing in the boot/flash path needs them
# (there is no signature/verification step).
#CONFIG_WOLFSSL_LINKEDSEMI_HARDWARE_AES_ALT=y
#CONFIG_WOLFSSL_LINKEDSEMI_OTBN_ECC_ALT=y
#CONFIG_WOLFSSL_LINKEDSEMI_OTBN_RSA_ALT=y
